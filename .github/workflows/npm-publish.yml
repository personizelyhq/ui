# Fallback publish: runs when a release is created by hand in GitHub (for example to
# finish a Release workflow run whose npm publish failed). Releases created by the
# Release workflow do not trigger it, because GITHUB_TOKEN events start no workflows.
# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run build:web-types

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION. Bump package.json or fix the tag."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run build:web-types
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
